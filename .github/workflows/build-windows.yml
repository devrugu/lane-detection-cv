name: Build Windows demo

# Builds LaneDetectionDemo.exe on a Windows runner whenever you push a tag
# like v1.0.0, and attaches the exe to a GitHub Release. Also runnable on
# demand from the Actions tab (workflow_dispatch) for a downloadable artifact
# without cutting a release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release and upload the asset

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r demo/requirements-demo.txt
          python -m pip install pyinstaller

      - name: Build executable
        run: pyinstaller demo/LaneDetectionDemo.spec --noconfirm

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaneDetectionDemo-windows
          path: dist/LaneDetectionDemo.exe
          if-no-files-found: error

      - name: Attach exe to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LaneDetectionDemo.exe
          generate_release_notes: true